{% extends 'dashboard.html' %}
{%block title%}
Rent
{%endblock title%}
{%block body%}
{% load static %}
<link rel="stylesheet" href="{% static 'weather.css' %}" />


<div class="app-wrap">
  <header>
    <input type="text" autocomplete="off" class="search-box" placeholder="Search for your location..." />
  </header>
  <main>
    <section class="location">
      <div class="city">Kathmandu, NP</div>
      <div class="date">Saturday 26 February 2022</div>
    </section>
    <div class="current">
      <div class="temp">15<span>°c</span></div>
      <div class="weather">Sunny</div>
      <div class="hi-low">13°c / 16°c</div>
    </div>
  </main>
</div>


<script src="{% static 'weather.js' %}"></script>
{%endblock body %}
